name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Build wheel and sdist
        run: uv build

      - name: Verify report.html.j2 is packaged in the wheel
        run: |
          wheel_file=$(ls dist/*.whl)
          if ! unzip -l "$wheel_file" | grep -q "cloudops_guard/reports/templates/report.html.j2"; then
            echo "report.html.j2 missing from built wheel: $wheel_file"
            unzip -l "$wheel_file"
            exit 1
          fi
