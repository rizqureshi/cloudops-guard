apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudops-guard-auditor
subjects:
  - kind: ServiceAccount
    name: cloudops-guard-auditor
    namespace: default # must match service-account.yaml
roleRef:
  kind: ClusterRole
  name: cloudops-guard-auditor
  apiGroup: rbac.authorization.k8s.io
