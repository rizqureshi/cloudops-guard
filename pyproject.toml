[project]
name = "cloudops-guard"
version = "0.2.0"
description = "Read-only auditing for Kubernetes and GitLab CI/CD reliability, security and cost hygiene"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "kubernetes>=29.0.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    # Transitively required by `kubernetes` already; declared explicitly because
    # the collector imports urllib3.exceptions directly to classify transport
    # failures (connection/DNS/TLS) separately from Kubernetes API errors.
    "urllib3>=2.0.0",
    "argon2-cffi>=25.1.0",
    # Phase 4E: moved from the `api` optional-dependency group into the
    # base runtime dependencies. `cloudops_guard.ingestion.fingerprint`
    # (the relocated, authoritative RFC 8785 fingerprint implementation
    # -- see that module and `ingestion_api/fingerprint.py`'s own
    # compatibility-shim docstring) is now imported by the base CLI's
    # `upload` command, not only by the local/staging-only ingestion API.
    "rfc8785>=0.1.4",
]

[project.scripts]
cloudops-guard = "cloudops_guard.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
# The local/staging ingestion API (Phase 4D) is an optional, separate
# service boundary -- installing the base `cloudops-guard` CLI never pulls
# in an HTTP framework or server. See `src/cloudops_guard/ingestion_api/
# __init__.py` for the justification of each dependency below.
api = [
    "starlette>=0.47.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    # rfc8785 moved to the base `dependencies` list above (Phase 4E) --
    # no longer declared here.
    # Already an existing transitive dependency of starlette/httpx; made
    # explicit because Phase 4D's correction pass (item 5) now imports it
    # directly, to move blocking Argon2id/report-validation/store work
    # off the event loop and onto a bounded worker thread
    # (`anyio.to_thread.run_sync`) -- see `app.py`.
    "anyio>=4.0.0",
]
# Phase 4G-A: the Azure production adapters (`src/cloudops_guard/
# ingestion_azure/`) are an optional, separate extra from `api` above --
# installing the local/staging `api` extra (or the base CLI) never pulls
# in a database driver or a cloud SDK. See `src/cloudops_guard/
# ingestion_azure/__init__.py` for the justification of each dependency
# below. No Azure resource is created, and no credential is read, by
# installing this extra -- it only makes the adapter *code* importable.
azure-production = [
    # A maintained, actively-developed PostgreSQL driver with a built-in,
    # synchronous connection pool (`psycopg_pool`) -- deliberately no ORM
    # (CLAUDE.md: "avoid unnecessary dependencies... justify any
    # addition"; the storage layer's interfaces, `cloudops_guard.
    # ingestion.interfaces`, are already a thin, explicit contract with no
    # need for a query builder or model-mapping layer on top of it). The
    # synchronous API is used deliberately: every `MetadataStore`/
    # `TokenStore`/`AttemptLimiter`/`RequestRateLimiter` method in this
    # codebase is already a plain synchronous call, invoked from
    # `app.py`'s existing `anyio.to_thread.run_sync` worker-thread
    # offload -- there is no event loop inside these adapters themselves
    # to justify an async driver.
    "psycopg[binary,pool]>=3.2.0",
    # The official Azure Blob Storage SDK -- `ReportBlobStore`'s
    # conditional-create (`put_if_absent`) requires Azure's own
    # If-None-Match precondition primitive, which this library exposes
    # directly; hand-rolling raw REST calls against Azure Storage's
    # control plane would be substantially riskier than using Microsoft's
    # own maintained client.
    "azure-storage-blob>=12.24.0",
    # `DefaultAzureCredential` -- managed-identity authentication to Blob
    # Storage. Never a storage-account key embedded in code or an image
    # (task 4's explicit requirement).
    "azure-identity>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_guard"]

[tool.hatch.build.targets.sdist]
exclude = ["/.claude"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...)/typer.Argument(...) as parameter defaults is the documented Typer pattern.
"src/cloudops_guard/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a real, reachable PostgreSQL instance (Phase 4G-A) -- see tests/ingestion_azure/conftest.py. Skipped when COG_TEST_POSTGRES_CONNINFO is unset, EXCEPT when COG_AZURE_TESTS_REQUIRED=1 (the dedicated Azure-adapters CI job), where an unreachable database fails loudly instead.",
    "azurite: requires a real, reachable Azurite (Azure Storage emulator) instance (Phase 4G-A) -- see tests/ingestion_azure/conftest.py. Same skip/fail-loud rule as the postgres marker above.",
]
